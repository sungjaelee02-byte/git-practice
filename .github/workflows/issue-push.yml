name: Create Issue
on:
  push:

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # 1. GitHub CLI 사용
      - name: Create issue with GitHub CLI
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues" \
            -f title="New push detected! (GitHub CLI)" \
            -f body="Pushed by ${{ github.actor }} on branch ${{ github.ref_name }}" \
            --jq '.html_url'

      # 2. curl 사용
      - name: Create issue with curl
        run: |
          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" \
            -d '{"title":"New push detected! (curl)","body":"Commit SHA: ${{ github.sha }}"}'